name: 1 · Feature & PR → develop

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ingestion/anac/requirements.txt
          pip install -r ingestion/anac/requirements-dev.txt

      - name: Lint
        run: flake8 ingestion/anac/bronze/ ingestion/anac/silver/

      - name: Test
        run: pytest ingestion/anac/bronze/ ingestion/anac/silver/

  terraform-plan-dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config="key=dev/terraform.tfstate"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan (dev)
        working-directory: terraform
        run: |
          terraform plan \
            -var-file=environments/dev.tfvars \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="allowed_cidr=${{ secrets.ALLOWED_CIDR }}"
