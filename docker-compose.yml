  version: "3.8"                                                                         
                                                                                        
  services:
    postgres:                                                                            
      image: postgres:15
      container_name: anac_postgres                                                      
      environment:     
        POSTGRES_USER: airflow
        POSTGRES_PASSWORD: airflow
        POSTGRES_DB: analytics
      ports:
        - "5432:5432"
      networks:
        - anac_network
    
    minio:                                                                               
      image: elestio/minio:latest                                                     
      container_name: anac_minio                                                         
      environment:
        MINIO_ROOT_USER: minioadmin                                                      
        MINIO_ROOT_PASSWORD: minioadmin
      ports:
        - "9000:9000"
        - "9001:9001"
      command: server /data --console-address ":9001"

      networks:
        - anac_network

    airflow:
      image: apache/airflow:2.8.1
      container_name: anac_airflow
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/analytics
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: "anac_secret_key"
        _AIRFLOW_DB_MIGRATE: "true"
        _AIRFLOW_WWW_USER_CREATE: "true"
        _AIRFLOW_WWW_USER_USERNAME: admin
        _AIRFLOW_WWW_USER_PASSWORD: airflow
      volumes:
        - ./airflow/dags:/opt/airflow/dags
      ports:
        - "8080:8080"
      depends_on:
        - postgres
      command: webserver
      networks:
        - anac_network    
  
  networks:
    anac_network:                                                                        
      driver: bridge