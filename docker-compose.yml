version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/analytics
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "anac_secret_key"
    _AIRFLOW_DB_MIGRATE: "true"
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: airflow
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.8.0 dbt-athena-community==1.8.0"
    BRONZE_BUCKET: "anac-raw-dev"
    SILVER_BUCKET: "anac-silver-dev"
    GOLD_BUCKET: "anac-gold-dev"
    DBT_TARGET: "dev"
    DBT_ENV: "dev"
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    AWS_DEFAULT_REGION: "sa-east-1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
  depends_on:
    - postgres
  networks:
    - anac_network

services:
  postgres:
    image: postgres:15
    container_name: anac_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    networks:
      - anac_network

  airflow-webserver:
    <<: *airflow-common
    container_name: anac_airflow_webserver
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: anac_airflow_scheduler
    command: scheduler

networks:
  anac_network:
    driver: bridge
