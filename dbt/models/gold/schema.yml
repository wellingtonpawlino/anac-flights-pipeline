version: 2

models:
  - name: fact_flights_by_airline
    description: "Métricas agregadas de voos por empresa aérea, mês e natureza"
    columns:
      - name: empresa_sigla
        data_tests:
          - not_null
      - name: ano
        data_tests:
          - not_null
      - name: mes
        data_tests:
          - not_null
      - name: taxa_ocupacao
        description: "RPK / ASK — proporção de assentos-quilômetros ocupados"

  - name: fact_flights_by_route
    description: "Métricas de voos por rota (origem → destino) e mês"
    columns:
      - name: aeroporto_de_origem_sigla
        data_tests:
          - not_null
      - name: aeroporto_de_destino_sigla
        data_tests:
          - not_null
      - name: ano
        data_tests:
          - not_null

  - name: fact_flights_monthly
    description: "Visão mensal consolidada do transporte aéreo"
    columns:
      - name: ano
        data_tests:
          - not_null
      - name: mes
        data_tests:
          - not_null
      - name: natureza
        data_tests:
          - not_null
